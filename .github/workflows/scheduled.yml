# 安徽生活广播（含改版前的安徽城市之声）回听缓存
# 夜间增量更新缓存 → 从缓存重建 RSS/OPML → 部署 GitHub Pages
#
# 触发方式
#   1. 定时：每天 UTC 16:00 = 北京时间 00:00（Asia/Shanghai，UTC+8，无夏令时）；
#   2. 手动：Actions 页面 → Run workflow，可指定增量探测天数，或跳过探测只用现有缓存重建。
#
# 数据来源：仓库 cache/ 目录（听友上传的历史缓存）。
#   - 必需：cache/probe_cache.csv、cache/roster.json
#   - 可选：cache/discovery.json、cache/ahrtv_episodes.json
#   - 缓存缺失时只输出醒目提示并跳过 update/build/deploy，定时任务不会变红（退出码 0）。
#
# 流程：检查缓存 → check → update（失败不阻断）→ 提交 cache/ 变更 → build（site/）→ 部署 Pages
name: 定期更新任务

on:
  schedule:
    # UTC 16:00 = 北京时间次日 00:00（UTC+8，无夏令时）
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '增量探测最近多少天（缓存里已有的日期会跳过）'
        required: false
        type: string
        default: '120'
      skip_update:
        description: '跳过增量探测，仅用现有缓存重建并部署'
        required: false
        type: boolean
        default: false

# 同一时间只跑一个 Pages 部署；不打断正在进行的任务，避免缓存提交/部署交错。
concurrency:
  group: github-pages
  cancel-in-progress: false

# contents: write 用于把更新后的 cache/ 提交回仓库；
# pages: write + id-token: write 供 deploy-pages@v4 通过 OIDC 部署 Pages。
permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  # README 约定的订阅地址；仓库变量 PUBLIC_BASE_URL 非空时以变量为准（见 docs/部署说明.md）
  DEFAULT_BASE_URL: https://taoengine.github.io/ahshgb-forever

jobs:
  refresh:
    name: 增量更新缓存并部署回听订阅
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 部署环境：deploy-pages 创建 github-pages 环境部署，URL 取部署步骤的输出
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 需要完整历史：后面要 commit + pull --rebase + push 缓存变更
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          # 项目零依赖：不需要 pip install / requirements / setup.py

      # ------------------------------------------------------------------
      # 1/7 检查仓库里是否已经上传历史缓存
      # ------------------------------------------------------------------
      - name: 检查历史缓存
        id: cache
        run: |
          set -uo pipefail
          required=( "cache/probe_cache.csv" "cache/roster.json" )
          optional=( "cache/discovery.json" "cache/ahrtv_episodes.json" )

          missing=()
          for f in "${required[@]}"; do
            if [ -f "$f" ]; then
              echo "✓ 必需缓存存在：$f"
            else
              echo "✗ 缺少必需缓存：$f"
              missing+=( "$f" )
            fi
          done
          for f in "${optional[@]}"; do
            if [ -f "$f" ]; then
              echo "✓ 可选缓存存在：$f"
            else
              echo "○ 可选缓存缺失（不影响运行）：$f"
            fi
          done

          {
            echo "## 安徽生活广播回听订阅 · 夜间任务"
            echo ""
            echo "- 触发事件：\`${GITHUB_EVENT_NAME}\`"
            echo "- 分支：\`${GITHUB_REF_NAME}\`"
            echo "- 输入：days=\`${{ github.event.inputs.days || '120' }}\`，skip_update=\`${{ github.event.inputs.skip_update || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "has_cache=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=缺少历史缓存::未找到 ${missing[*]}；本次跳过增量更新、构建与部署（任务不会失败）。请把历史缓存上传到仓库 cache/ 目录，参考 docs/部署说明.md。"
            {
              echo ""
              echo "### ⚠️ 缺少历史缓存，本次任务跳过"
              echo ""
              echo "缺少以下必需文件（需上传到仓库 \`cache/\` 目录）："
              for f in "${missing[@]}"; do
                echo "- \`$f\`"
              done
              echo ""
              echo "补齐后可在 Actions 页面手动 Run workflow，或等待下一次定时任务。详见 \`docs/部署说明.md\`。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_cache=true" >> "$GITHUB_OUTPUT"
          echo "历史缓存齐全，继续执行。"

      # ------------------------------------------------------------------
      # 2/7 校验缓存（CLI: check）
      # ------------------------------------------------------------------
      - name: 校验缓存
        id: check
        if: ${{ steps.cache.outputs.has_cache == 'true' }}
        run: |
          set -uo pipefail
          set +e  # GitHub Actions 默认 bash -e，这里显式检查退出码，失败也要先写 step summary
          python -m ahshgb check --cache-dir cache 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          {
            echo ""
            echo "### 缓存校验"
            echo ""
            echo '```'
            tail -n 30 check.log 2>/dev/null || echo "(无输出)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      # ------------------------------------------------------------------
      # 3/7 增量更新（CLI: update；失败不阻断，仍用旧缓存继续构建/部署）
      # ------------------------------------------------------------------
      - name: 增量更新缓存
        id: update
        if: ${{ steps.cache.outputs.has_cache == 'true' }}
        continue-on-error: true
        env:
          DAYS: ${{ github.event.inputs.days || '120' }}
          SKIP_UPDATE: ${{ github.event.inputs.skip_update || 'false' }}
        run: |
          set -uo pipefail
          set +e  # GitHub Actions 默认 bash -e，这里显式检查退出码：失败也要先写 step summary 再告警
          if [ "${SKIP_UPDATE}" = "true" ]; then
            echo "skip_update=true，跳过增量探测，直接用现有缓存重建。"
            {
              echo ""
              echo "### 增量更新"
              echo ""
              echo "本次通过手动触发选择 \`skip_update=true\`，跳过增量探测。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "${DAYS}" =~ ^[0-9]+$ ]]; then
            echo "::error title=参数错误::days 必须是正整数，收到：${DAYS}"
            exit 2
          fi

          python -m ahshgb update --cache-dir cache --days "${DAYS}" --workers 8 2>&1 | tee update.log
          status=${PIPESTATUS[0]}
          {
            echo ""
            echo "### 增量更新（最近 ${DAYS} 天）"
            echo ""
            echo "\`python -m ahshgb update --cache-dir cache --days ${DAYS} --workers 8\` 退出码：\`${status}\`"
            echo ""
            echo '```'
            tail -n 30 update.log 2>/dev/null || echo "(无输出)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${status}" -ne 0 ]; then
            echo "::warning title=增量探测失败::update 退出码 ${status}；继续用现有缓存构建站点。"
          fi
          exit "${status}"

      # ------------------------------------------------------------------
      # 4/7 提交 cache/ 变更（仅有 diff 时提交；push 前 pull --rebase，最多重试 3 次）
      # ------------------------------------------------------------------
      - name: 提交缓存变更
        id: commit
        if: ${{ steps.cache.outputs.has_cache == 'true' }}
        run: |
          set -uo pipefail
          if [ "${GITHUB_REF_TYPE:-branch}" != "branch" ]; then
            echo "::warning title=跳过缓存提交::当前触发引用不是分支（${GITHUB_REF_TYPE}），不自动提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- cache)" ]; then
            echo "cache/ 无变化，跳过提交。"
            {
              echo ""
              echo "### 缓存提交"
              echo ""
              echo "\`cache/\` 无变化，本次不提交。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add -A -- cache
          if ! git commit -m "chore(cache): 自动更新阿基米德回听缓存（$(date -u '+%Y-%m-%d %H:%M UTC')）"; then
            echo "::error title=缓存提交失败::git commit 失败，详见上方日志。"
            exit 1
          fi

          pushed=false
          for attempt in 1 2 3; do
            echo "第 ${attempt}/3 次尝试 pull --rebase + push ……"
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 5))
          done

          if [ "${pushed}" != "true" ]; then
            echo "::error title=缓存推送失败::连续 3 次 pull --rebase / push 失败，常见原因是分支保护或 GITHUB_TOKEN 权限不足，详见 docs/部署说明.md。"
            exit 1
          fi

          {
            echo ""
            echo "### 缓存提交"
            echo ""
            echo "已提交并推送 \`cache/\` 的变更（commit：\`$(git rev-parse --short HEAD)\`）。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "缓存变更已推送。"

      # ------------------------------------------------------------------
      # 5/7 从缓存构建静态站点（site/ahshgb.opml + site/feeds/*.xml）
      # ------------------------------------------------------------------
      - name: 构建站点
        id: build
        if: ${{ steps.cache.outputs.has_cache == 'true' }}
        env:
          # 仓库变量未设置时为空字符串，下面用 shell 兜底到 README 约定地址
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          set -uo pipefail
          set +e  # GitHub Actions 默认 bash -e，这里显式检查退出码：失败也要先写 step summary 再退出
          base_url="${PUBLIC_BASE_URL:-${DEFAULT_BASE_URL}}"
          base_url="${base_url%/}"
          echo "SITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
          echo "本次发布地址：${base_url}"

          python -m ahshgb build --cache-dir cache --out site --base-url "${base_url}" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          {
            echo ""
            echo "### 站点构建"
            echo ""
            echo "- 发布地址：<${base_url}>"
            echo "- 订阅入口：<${base_url}/ahshgb.opml>"
            echo ""
            echo '```'
            tail -n 30 build.log 2>/dev/null || echo "(无输出)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${status}" -ne 0 ]; then
            echo "::error title=站点构建失败::build 退出码 ${status}，已停止部署。"
            exit "${status}"
          fi

      # ------------------------------------------------------------------
      # 6/7 统计缓存（CLI: stats，仅用于 step summary，失败不影响部署）
      # ------------------------------------------------------------------
      - name: 统计缓存
        id: stats
        if: ${{ steps.cache.outputs.has_cache == 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e  # GitHub Actions 默认 bash -e，这里显式检查退出码（统计失败不影响部署）
          python -m ahshgb stats --cache-dir cache 2>&1 | tee stats.log
          status=${PIPESTATUS[0]}
          {
            echo ""
            echo "### 缓存统计"
            echo ""
            echo '```'
            tail -n 40 stats.log 2>/dev/null || echo "(无输出)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      # ------------------------------------------------------------------
      # 7/7 部署到 GitHub Pages（只上传 site/ 产物，无需 Jekyll 构建）
      # ------------------------------------------------------------------
      - name: 配置 Pages
        if: ${{ steps.cache.outputs.has_cache == 'true' }}
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        if: ${{ steps.cache.outputs.has_cache == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deploy
        if: ${{ steps.cache.outputs.has_cache == 'true' }}
        uses: actions/deploy-pages@v4

      # 放在最后：always() 保证即使前面失败/跳过也能给出汇总
      - name: 汇总任务状态
        if: ${{ always() && steps.cache.outputs.has_cache == 'true' }}
        run: |
          set -uo pipefail
          {
            echo ""
            echo "### 任务结果"
            echo ""
            echo "| 步骤 | 结果 |"
            echo "| --- | --- |"
            echo "| 缓存校验 | \`${{ steps.check.outcome || 'skipped' }}\` |"
            echo "| 增量更新 | \`${{ steps.update.outcome || 'skipped' }}\` |"
            echo "| 缓存提交 | \`${{ steps.commit.outcome || 'skipped' }}\` |"
            echo "| 站点构建 | \`${{ steps.build.outcome || 'skipped' }}\` |"
            echo "| 缓存统计 | \`${{ steps.stats.outcome || 'skipped' }}\` |"
            echo "| 部署 Pages | \`${{ steps.deploy.outcome || 'skipped' }}\` |"
            echo ""
            echo "部署地址：${{ steps.deploy.outputs.page_url || '（本次未部署）' }}"
            echo ""
            echo "订阅入口：<${SITE_BASE_URL:-${DEFAULT_BASE_URL}}/ahshgb.opml>"
          } >> "$GITHUB_STEP_SUMMARY"
