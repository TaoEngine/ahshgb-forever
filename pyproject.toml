[project]
name = "ahshgb-forever"
version = "0.1.0"
description = "恢复阿基米德fm被删除的安徽生活广播回听列表"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ahshgb = "ahshgb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ahshgb"]
